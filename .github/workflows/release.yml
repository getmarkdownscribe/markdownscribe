name: release

# Tag sdk-vX.Y.Z stages @markdownscribe/sdk; cli-vX.Y.Z stages markdownscribe.
# Staged publishing: the workflow uploads the tarball through trusted publishing
# (OIDC, no npm token stored here), and a maintainer approves it on npmjs.com
# with 2FA before it becomes installable. The trusted publisher connections
# allow staging only, on purpose. Requires npm >= 11.15.0
# (https://docs.npmjs.com/trusted-publishers/,
# https://github.blog/changelog/2026-05-22-staged-publishing-and-new-install-time-controls-for-npm/).
# After approval, verify with:
#   node scripts/check-npm-published.mjs <package> <version>

on:
  push:
    tags:
      - "sdk-v*"
      - "cli-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MDSCRIBE_API_KEY: ${{ secrets.MDSCRIBE_API_KEY }}
      MDSCRIBE_REQUIRE_LIVE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: npm with staged publishing (>= 11.15.0)
        run: |
          npm install -g npm@^11.15.0
          npm --version
      - name: Resolve package from tag
        id: pkg
        run: |
          case "$GITHUB_REF_NAME" in
            sdk-v*) echo "dir=packages/sdk" >> "$GITHUB_OUTPUT"; echo "version=${GITHUB_REF_NAME#sdk-v}" >> "$GITHUB_OUTPUT" ;;
            cli-v*) echo "dir=packages/cli" >> "$GITHUB_OUTPUT"; echo "version=${GITHUB_REF_NAME#cli-v}" >> "$GITHUB_OUTPUT" ;;
            *) echo "unknown tag $GITHUB_REF_NAME"; exit 1 ;;
          esac
      - name: Tag matches package.json
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: test "$(node -p "require('./package.json').version")" = "${{ steps.pkg.outputs.version }}"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Pin the SDK dependency of the CLI
        if: steps.pkg.outputs.dir == 'packages/cli'
        working-directory: packages/cli
        # `workspace:^` only means something inside this repository; npm needs a real range.
        run: npm pkg set "dependencies.@markdownscribe/sdk=^$(node -p "require('../sdk/package.json').version")"
      - name: Stage for approval
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm stage publish --access public
      - name: Next step
        run: echo "Staged. Approve it at npmjs.com (Staged Packages, 2FA), then run scripts/check-npm-published.mjs."
