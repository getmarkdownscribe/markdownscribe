name: release

# Tag sdk-vX.Y.Z publishes @markdownscribe/sdk; cli-vX.Y.Z publishes markdownscribe.
# Publishing uses npm trusted publishing (OIDC): no npm token is stored here,
# and npm attaches provenance automatically. Requires npm >= 11.5.1 and
# Node >= 22.14 (https://docs.npmjs.com/trusted-publishers/).

on:
  push:
    tags:
      - "sdk-v*"
      - "cli-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MDSCRIBE_API_KEY: ${{ secrets.MDSCRIBE_API_KEY }}
      MDSCRIBE_REQUIRE_LIVE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: npm supports trusted publishing
        run: |
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number);if(a<11||(a===11&&(b<5||(b===5&&c<1)))){console.error('npm >= 11.5.1 required');process.exit(1)}" "$(npm --version)"
      - name: Resolve package from tag
        id: pkg
        run: |
          case "$GITHUB_REF_NAME" in
            sdk-v*) echo "dir=packages/sdk" >> "$GITHUB_OUTPUT"; echo "version=${GITHUB_REF_NAME#sdk-v}" >> "$GITHUB_OUTPUT" ;;
            cli-v*) echo "dir=packages/cli" >> "$GITHUB_OUTPUT"; echo "version=${GITHUB_REF_NAME#cli-v}" >> "$GITHUB_OUTPUT" ;;
            *) echo "unknown tag $GITHUB_REF_NAME"; exit 1 ;;
          esac
      - name: Tag matches package.json
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: test "$(node -p "require('./package.json').version")" = "${{ steps.pkg.outputs.version }}"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Pin the SDK dependency of the CLI
        if: steps.pkg.outputs.dir == 'packages/cli'
        working-directory: packages/cli
        # `workspace:^` only means something inside this repository; npm needs a real range.
        run: npm pkg set "dependencies.@markdownscribe/sdk=^$(node -p "require('../sdk/package.json').version")"
      - name: Publish
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm publish --access public
      - name: Verify the registry (metadata + provenance)
        run: node scripts/check-npm-published.mjs "$(node -p "require('./${{ steps.pkg.outputs.dir }}/package.json').name")" "${{ steps.pkg.outputs.version }}"
