name: Bug report
description: Something in the CLI, the SDK or the API did not work as documented.
labels: [bug]
body:
  - type: input
    id: request_id
    attributes:
      label: request_id
      description: >-
        Every response carries one: the X-Request-Id header, `meta.request_id` or
        `error.requestId` in the SDK, and the last line of a CLI error. It is how we
        find your call in our logs.
      placeholder: 01JBQ8Z5R7X9K2M4N6P8Q0S2T4
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Client
      options:
        - CLI (markdownscribe)
        - SDK (@markdownscribe/sdk)
        - REST API directly
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "`mdscribe --version`, or the SDK version in package.json."
  - type: textarea
    id: what_happened
    attributes:
      label: What happened, and what did you expect?
      description: Include the command or code you ran. Never paste an API key.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Node 22.14, Windows 11, PowerShell 7
